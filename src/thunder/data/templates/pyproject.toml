[build-system]
requires = ["scikit-build-core", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "thunder_<ROBOT>_py"
version = "0.1.0"
description = "Thunder <ROBOT> robot dynamics library with Python bindings"
requires-python = ">=3.8"
dependencies = [
    "pybind11",
    "numpy",
]


[tool.scikit-build]
# Optimization settings for faster builds
cmake.minimum-version = "3.15"
cmake.build-type = "Release"

# Configure parallel compilation - use all available cores
# This significantly speeds up the build
build.jobs = 0  # 0 means auto-detect CPU count

# Wheel configuration for faster builds
wheel.packages = ["thunder_<ROBOT>_py"]

# Strip binaries to reduce wheel size
wheel.exclude = []

# Build-related options to speed up compilation
cmake.args = [
    "-DUSE_SYSTEM_YAML_CPP=ON",  # Prefer system yaml-cpp to avoid rebuilding
    "-DCMAKE_BUILD_TYPE=Release",  # Explicit Release mode
]

# Optional: cache improvements
[tool.scikit-build.env]
# Speeds up compilation by avoiding rebuilds
CMAKE_GENERATOR = "Ninja"  # Use Ninja if available for faster builds